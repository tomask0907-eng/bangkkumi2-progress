<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5F2">
<title>방꾸미 2.0 · 작업 진행 상황</title>
<style>
  :root {
    --bg: #F6F5F2;
    --card: #FFFFFF;
    --line: #E4E1DA;
    --text: #2B2A28;
    --muted: #6F6B64;
    --accent: #456A8C;
    --accent-soft: #E6EDF4;
    --done: #3F7A5C;
    --done-soft: #E4F0E9;
    --wait: #8A5A12;
    --wait-soft: #FAEFD9;
    --track: #ECE9E3;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; }
  header { margin-bottom: 18px; }
  .brand { color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: 0; margin: 0; }
  h1 { font-size: 26px; line-height: 1.3; margin: 2px 0 6px; }
  .updated { color: var(--muted); font-size: 14px; margin: 0; }
  h2 { font-size: 17px; margin: 0; }
  h3 { font-size: 15px; margin: 0; font-weight: 600; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-top: 14px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .task-name { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .percent-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .percent { font-size: 34px; font-weight: 700; line-height: 1.1; }
  .count { color: var(--muted); font-size: 14px; }
  .bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; width: 0; transition: width .4s ease; }
  .now { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 0; }
  .now b { color: var(--accent); display: block; font-size: 13px; }
  .chip {
    flex: none;
    font-size: 13px; font-weight: 600;
    padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: #fff;
    white-space: nowrap;
  }
  .chip.done { color: var(--done); background: var(--done-soft); border-color: transparent; }
  .chip.doing { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .chip.wait { color: var(--wait); background: var(--wait-soft); border-color: transparent; }
  ul.items { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.items li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  ul.items li:first-child { border-top: 0; }
  .mark {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; margin-top: 2px;
    border: 1.5px solid var(--line); color: var(--muted); background: #fff;
  }
  .mark.done { background: var(--done); border-color: var(--done); color: #fff; }
  .mark.doing { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mark.wait { background: var(--wait-soft); border-color: var(--wait); color: var(--wait); }
  .item-body { min-width: 0; flex: 1; }
  .item-title { margin: 0; }
  .item-title.done { color: var(--muted); }
  .item-state { color: var(--muted); font-size: 13px; margin-left: 6px; white-space: nowrap; }
  .note { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .user-card { border-color: #E9D9B5; }
  ol.roadmap { margin: 12px 0 0; padding-left: 22px; }
  ol.roadmap li { padding: 4px 0; color: var(--muted); }
  ol.roadmap li.current { color: var(--text); font-weight: 600; }
  ol.roadmap li.done { color: var(--done); }
  ol.roadmap .tag { font-size: 13px; font-weight: 600; color: var(--accent); margin-left: 6px; }
  ul.log { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.log li { display: flex; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
  ul.log li:first-child { border-top: 0; }
  ul.log time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.2em; }
  footer { color: var(--muted); font-size: 13px; margin-top: 22px; text-align: center; }
  .error { color: var(--wait); }
  @media (max-width: 420px) {
    h1 { font-size: 22px; }
    .percent { font-size: 30px; }
    .card { padding: 16px 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">방꾸미 2.0</p>
    <h1>작업 진행 상황</h1>
    <p class="updated" id="updated">불러오는 중이에요…</p>
  </header>

  <section class="card" aria-labelledby="overall-title">
    <h2 id="overall-title" class="task-name">지금 하는 큰 작업</h2>
    <div class="percent-row">
      <span class="percent" id="percent">–</span>
      <span class="count" id="count"></span>
    </div>
    <div class="bar" id="bar" role="progressbar" aria-label="큰 작업 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    <p class="now" aria-live="polite"><b>지금 하는 일</b><span id="now">–</span></p>
  </section>

  <div id="stages"></div>

  <section class="card user-card" id="user-card" hidden aria-labelledby="user-title">
    <div class="card-head"><h2 id="user-title">사용자님이 해 주실 일</h2></div>
    <ul class="items" id="user-items"></ul>
  </section>

  <section class="card" id="roadmap-card" hidden aria-labelledby="roadmap-title">
    <div class="card-head"><h2 id="roadmap-title">전체 계획</h2></div>
    <ol class="roadmap" id="roadmap"></ol>
  </section>

  <section class="card" id="log-card" hidden aria-labelledby="log-title">
    <div class="card-head"><h2 id="log-title">최근 기록</h2></div>
    <ul class="log" id="log"></ul>
  </section>

  <footer>이 페이지는 약 1분 30초마다 새 내용을 자동으로 읽어 와요.</footer>
</main>

<script>
(function () {
  'use strict';
  var OWNER = 'tomask0907-eng';
  var REPO = 'bangkkumi2-progress';
  var POLL_MS = 90000;
  // 최신 내용을 가장 빨리 주는 곳부터 차례로 시도한다.
  var SOURCES = [
    { url: 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/progress.json?ref=main', accept: 'application/vnd.github.raw+json' },
    { url: 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/main/progress.json' },
    { url: 'progress.json' }
  ];
  var STATE_LABEL = { done: '완료', doing: '진행 중', todo: '대기', wait: '기다리는 중', skip: '건너뜀' };
  var STATE_MARK = { done: '✓', doing: '●', todo: '', wait: '!', skip: '–' };
  var current = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function stateOf(value) { return Object.prototype.hasOwnProperty.call(STATE_LABEL, value) ? value : 'todo'; }
  function safeLink(link) {
    if (!link || typeof link.url !== 'string' || !/^https:\/\//.test(link.url)) return null;
    var a = el('a', null, link.label || link.url);
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    return a;
  }

  function fetchJson(source) {
    var url = new URL(source.url, location.href);
    url.searchParams.set('t', String(Date.now()));
    var options = { cache: 'no-store' };
    if (source.accept) options.headers = { Accept: source.accept };
    return fetch(url.toString(), options).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || !Array.isArray(data.stages)) throw new Error('형식이 다름');
      return data;
    });
  }
  function load(index) {
    if (index >= SOURCES.length) return Promise.resolve(null);
    return fetchJson(SOURCES[index]).catch(function () { return load(index + 1); });
  }

  function itemRow(item) {
    var state = stateOf(item.status);
    var li = el('li');
    var mark = el('span', 'mark ' + state, STATE_MARK[state]);
    mark.setAttribute('aria-hidden', 'true');
    li.appendChild(mark);
    var body = el('div', 'item-body');
    var title = el('p', 'item-title ' + state, item.title || '');
    title.appendChild(el('span', 'item-state', STATE_LABEL[state]));
    body.appendChild(title);
    if (item.note || item.link) {
      var note = el('p', 'note', item.note || '');
      var a = safeLink(item.link);
      if (a) { if (item.note) note.appendChild(document.createTextNode(' ')); note.appendChild(a); }
      body.appendChild(note);
    }
    li.appendChild(body);
    return li;
  }

  function stageState(stage) {
    var items = (stage.items || []).filter(function (i) { return stateOf(i.status) !== 'skip'; });
    if (items.length && items.every(function (i) { return stateOf(i.status) === 'done'; })) return 'done';
    if (items.some(function (i) { var s = stateOf(i.status); return s === 'doing' || s === 'done'; })) return 'doing';
    if (items.length && items.every(function (i) { return stateOf(i.status) === 'wait'; })) return 'wait';
    return 'todo';
  }

  function timeText(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  }
  function agoText(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var min = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    if (min < 1) return '방금 전';
    if (min < 60) return min + '분 전';
    var hours = Math.floor(min / 60);
    if (hours < 24) return hours + '시간 ' + (min % 60) + '분 전';
    return Math.floor(hours / 24) + '일 전';
  }
  function renderUpdated() {
    if (!current || !current.updatedAt) return;
    var d = new Date(current.updatedAt);
    var day = isNaN(d.getTime()) ? '' : d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) + ' ';
    $('updated').className = 'updated';
    $('updated').textContent = '마지막 갱신: ' + day + timeText(current.updatedAt) + ' (' + agoText(current.updatedAt) + ')';
  }

  function render(data) {
    current = data;
    document.title = (data.title || '방꾸미 2.0 · 작업 진행 상황');
    $('overall-title').textContent = data.task ? '지금 하는 큰 작업 · ' + data.task : '지금 하는 큰 작업';

    var all = [];
    data.stages.forEach(function (s) { (s.items || []).forEach(function (i) { if (stateOf(i.status) !== 'skip') all.push(i); }); });
    var done = all.filter(function (i) { return stateOf(i.status) === 'done'; }).length;
    var pct = all.length ? Math.round(done / all.length * 100) : 0;
    $('percent').textContent = pct + '%';
    $('count').textContent = all.length + '개 중 ' + done + '개 완료';
    $('bar').setAttribute('aria-valuenow', String(pct));
    $('bar').firstElementChild.style.width = pct + '%';
    $('now').textContent = data.now || '–';

    var wrap = $('stages');
    wrap.textContent = '';
    data.stages.forEach(function (stage) {
      var state = stageState(stage);
      var card = el('section', 'card');
      var head = el('div', 'card-head');
      head.appendChild(el('h2', null, stage.title || ''));
      head.appendChild(el('span', 'chip ' + state, STATE_LABEL[state]));
      card.appendChild(head);
      var list = el('ul', 'items');
      (stage.items || []).forEach(function (item) { list.appendChild(itemRow(item)); });
      card.appendChild(list);
      wrap.appendChild(card);
    });

    var user = Array.isArray(data.waitingForUser) ? data.waitingForUser : [];
    $('user-card').hidden = user.length === 0;
    var userList = $('user-items');
    userList.textContent = '';
    user.forEach(function (item) { userList.appendChild(itemRow(item)); });

    var roadmap = Array.isArray(data.roadmap) ? data.roadmap : [];
    $('roadmap-card').hidden = roadmap.length === 0;
    var ol = $('roadmap');
    ol.textContent = '';
    roadmap.forEach(function (step) {
      var state = step.status === 'current' || step.status === 'done' ? step.status : '';
      var li = el('li', state, step.title || '');
      if (state === 'current') li.appendChild(el('span', 'tag', '지금 여기'));
      if (state === 'done') li.appendChild(el('span', 'tag', '완료'));
      ol.appendChild(li);
    });

    var log = Array.isArray(data.log) ? data.log.slice(0, 15) : [];
    $('log-card').hidden = log.length === 0;
    var ul = $('log');
    ul.textContent = '';
    log.forEach(function (entry) {
      var li = el('li');
      var t = el('time', null, timeText(entry.at));
      if (entry.at) t.setAttribute('datetime', entry.at);
      li.appendChild(t);
      li.appendChild(el('span', null, entry.text || ''));
      ul.appendChild(li);
    });
    renderUpdated();
  }

  function refresh() {
    return load(0).then(function (data) {
      if (!data) {
        if (!current) { $('updated').className = 'updated error'; $('updated').textContent = '진행 상황을 불러오지 못했어요. 잠시 뒤 다시 시도해요.'; }
        return;
      }
      // 느린 경로가 예전 내용을 돌려줘도 화면이 뒤로 가지 않게 한다.
      if (current && current.updatedAt && data.updatedAt && new Date(data.updatedAt) < new Date(current.updatedAt)) return;
      render(data);
    });
  }

  refresh();
  setInterval(function () { if (document.visibilityState === 'visible') refresh(); }, POLL_MS);
  setInterval(renderUpdated, 30000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });
})();
</script>
</body>
</html>
